<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuldeep Mobile - Admin</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f5f7;font-family:Arial,sans-serif;color:#111}.wrap{max-width:700px;margin:auto;padding:12px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 15px #0001}h1{margin:0 0 5px}.muted{color:#666;font-size:14px}.hide{display:none}input,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ccc;font-size:16px}button{border:0;background:#111;color:#fff;font-weight:700}.green{background:#128c4a}.red{background:#c62828}.blue{background:#2563eb}.gray{background:#666}.msg{padding:10px;border-radius:10px;background:#eef5ff;margin-top:8px;white-space:pre-wrap}.item{border:1px solid #ddd;border-radius:14px;padding:10px;margin:10px 0}.item img{width:100%;max-height:220px;object-fit:contain;border-radius:10px;background:#f5f5f5}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.small{font-size:13px;color:#555}.preview{width:100%;max-height:240px;object-fit:contain;border-radius:12px;display:none;margin-top:8px}</style></head>
<body><div class="wrap">
<div class="card"><h1>📱 KULDEEP MOBILE</h1><div class="muted">Admin — Add / Edit / Delete</div></div>
<div id="loginBox" class="card"><h3>🔐 Admin Login</h3><input id="email" type="email" placeholder="Admin Email"><input id="password" type="password" placeholder="Password"><button onclick="loginAdmin()">Login</button><div id="loginMsg" class="msg"></div></div>
<div id="dashboard" class="hide">
<div class="card"><h3 id="formTitle">📸 नया Product जोड़ें</h3><input id="title" placeholder="Product / Offer name"><input id="brand" placeholder="Brand"><input id="model" placeholder="Mobile model"><input id="price" type="number" placeholder="Price ₹"><input id="offer" placeholder="Offer text (optional)"><input id="photo" type="file" accept="image/*" onchange="previewPhoto()"><img id="photoPreview" class="preview"><div class="row"><button class="green" id="saveBtn" onclick="saveProduct()">➕ Add to Website</button><button class="gray" id="cancelBtn" onclick="cancelEdit()" style="display:none">Cancel</button></div><div id="productMsg" class="msg"></div></div>
<div class="card"><h3>📋 Website Products</h3><button class="blue" onclick="loadProducts()">🔄 Refresh List</button><div id="listMsg" class="msg"></div><div id="productList"></div></div>
<div class="card"><button class="red" onclick="logout()">Logout</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://huousyafsqmfjazwjphz.supabase.co";const SUPABASE_PUBLISHABLE_KEY="sb_publishable_dGH5vs_CIFYDmL1PezBoWw_hpcpJhm5";const SUPABASE_BUCKET="Skin-photo";const SUPABASE_TABLE="skin_photos";let db=null,editingId=null,editingOldPath=null;
function init(){if(!window.supabase)return "Supabase library load nahi hui.";if(!db)db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);return ""}
function msg(id,t){document.getElementById(id).textContent=t}
async function loginAdmin(){msg('loginMsg','Login check ho raha hai...');const e=init();if(e){msg('loginMsg',e);return}const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password){msg('loginMsg','Email aur password bhariye.');return}const r=await db.auth.signInWithPassword({email,password});if(r.error){msg('loginMsg','Login error: '+r.error.message);return}document.getElementById('loginBox').classList.add('hide');document.getElementById('dashboard').classList.remove('hide');await loadProducts()}
function previewPhoto(){const f=document.getElementById('photo').files[0];if(!f)return;const x=document.getElementById('photoPreview');x.src=URL.createObjectURL(f);x.style.display='block'}
function safe(s){return s.replace(/[^a-zA-Z0-9._-]+/g,'-').toLowerCase()}
function publicUrl(path){return db.storage.from(SUPABASE_BUCKET).getPublicUrl(path).data.publicUrl}
async function saveProduct(){const e=init();if(e){msg('productMsg',e);return}const {data:{user}}=await db.auth.getUser();if(!user){msg('productMsg','Pehle login karein.');return}const title=document.getElementById('title').value.trim(),brand=document.getElementById('brand').value.trim(),model=document.getElementById('model').value.trim(),price=document.getElementById('price').value,offer=document.getElementById('offer').value.trim(),f=document.getElementById('photo').files[0];if(!title){msg('productMsg','Product name bhariye.');return}
 let image_path=editingOldPath;if(f){const path='products/'+Date.now()+'-'+safe(f.name);const up=await db.storage.from(SUPABASE_BUCKET).upload(path,f);if(up.error){msg('productMsg','Photo upload error: '+up.error.message);return}image_path=path}
 const row={title,brand,model,price:price?Number(price):null,offer,image_path};let r;if(editingId){r=await db.from(SUPABASE_TABLE).update(row).eq('id',editingId);if(r.error){msg('productMsg','Update error: '+r.error.message);return}if(f&&editingOldPath){await db.storage.from(SUPABASE_BUCKET).remove([editingOldPath])}msg('productMsg','✅ Product correction ho gayi.');}else{r=await db.from(SUPABASE_TABLE).insert(row);if(r.error){if(f)await db.storage.from(SUPABASE_BUCKET).remove([image_path]);msg('productMsg','Database error: '+r.error.message);return}msg('productMsg','✅ Product add ho gaya.')}cancelEdit();await loadProducts()}
function editProduct(p){editingId=p.id;editingOldPath=p.image_path||null;document.getElementById('formTitle').textContent='✏️ Product Correction';document.getElementById('saveBtn').textContent='💾 Save Correction';document.getElementById('cancelBtn').style.display='block';document.getElementById('title').value=p.title||'';document.getElementById('brand').value=p.brand||'';document.getElementById('model').value=p.model||'';document.getElementById('price').value=p.price??'';document.getElementById('offer').value=p.offer||'';document.getElementById('photo').value='';window.scrollTo({top:0,behavior:'smooth'})}
function cancelEdit(){editingId=null;editingOldPath=null;document.getElementById('formTitle').textContent='📸 नया Product जोड़ें';document.getElementById('saveBtn').textContent='➕ Add to Website';document.getElementById('cancelBtn').style.display='none';document.getElementById('title').value='';document.getElementById('brand').value='';document.getElementById('model').value='';document.getElementById('price').value='';document.getElementById('offer').value='';document.getElementById('photo').value='';document.getElementById('photoPreview').style.display='none'}
async function deleteProduct(p){if(!confirm('Ye product website se delete karna hai?'))return;const e=init();if(e){msg('listMsg',e);return}const r=await db.from(SUPABASE_TABLE).delete().eq('id',p.id);if(r.error){msg('listMsg','Delete error: '+r.error.message);return}if(p.image_path)await db.storage.from(SUPABASE_BUCKET).remove([p.image_path]);msg('listMsg','✅ Product delete ho gaya.');await loadProducts()}
async function loadProducts(){const e=init();if(e){msg('listMsg',e);return}msg('listMsg','List load ho rahi hai...');const r=await db.from(SUPABASE_TABLE).select('*').order('created_at',{ascending:false});if(r.error){msg('listMsg','List error: '+r.error.message);return}const list=document.getElementById('productList');if(!r.data.length){list.innerHTML='<p class="small">Abhi koi product nahi mila.</p>';msg('listMsg','');return}list.innerHTML=r.data.map(p=>`<div class="item"><img src="${p.image_path?publicUrl(p.image_path):''}" onerror="this.style.display='none'"><b>${esc(p.title||'')}</b><div class="small">${esc(p.brand||'')} ${esc(p.model||'')} ${p.price!=null?'• ₹'+p.price:''}</div><div class="small">${esc(p.offer||'')}</div><div class="row"><button class="blue" onclick='editProduct(${JSON.stringify(p)})'>✏️ Edit</button><button class="red" onclick='deleteProduct(${JSON.stringify(p)})'>🗑️ Delete</button></div></div>`).join('');msg('listMsg','')}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function logout(){if(db)await db.auth.signOut();location.reload()}
</script></body></html>
